block-drops:
  randomize-block-drops: true
  min-block-drops: 1
  max-block-drops: 10
  # A random number between min-block-drops and max-block-drops will determine the amount of items dropped

mob-drops:
  randomize-mob-drops: true
  randomize-mob-xp-drops: true

  min-mob-drops: 1
  max-mob-drops: 10
  # A random number between min-mob-drops and max-mob-drops will determine the amount of items dropped
  min-mob-xp: 1
  max-mob-xp: 50
  # A random number between min-mob-xp and max-mob-xp will determine the amount of xp dropped

show-timer: true
timer-style: "<gradient:gold:yellow><time>"
timer-format: 1
# 1: e.g. 1h 1m 1s
# 2: e.g. 01 : 01 : 01
use-player-list: false
auto-shuffle: false
# When true, the randomizer will automatically shuffle when started
save-random-pairs: true
# When true, the generated random pairs will be saved. When false, a block will drop a different item each time it is broken
creative-drops: true
# When true, players in creative mode are affected by the randomizer

# Plugin messages support Minimessage formatting -> https://docs.papermc.io/adventure/minimessage/format/
plugin-messages:
  prefix: "[<rainbow>Randomizer</rainbow>] "
  randomizer-on: "Randomizer is now <bold><green>enabled"
  randomizer-on-shuffle: "Randomizer is now <bold><green>enabled<reset> and shuffled"
  randomizer-off: "Randomizer is now <bold><red>disabled"
  config-reload: "Reloaded the config"
  already-enabled: "<red><bold>Error:</bold> Randomizer is already ON"
  already-disabled: "<red><bold>Error:</bold> Randomizer is already OFF"
  status-on: "Randomizer is currently <bold><green>enabled"
  status-off: "Randomizer is currently <bold><red>disabled"
  randomizer-shuffled: "Randomizer has been shuffled"
  randomizer-shuffled-mobs: "Randomizer mob drops have been shuffled"
  randomizer-shuffled-blocks: "Randomizer block drops have been shuffled"
  permission-error: "<red><bold>Error:</bold> You don't have the required permissions to use that"
  argument-error: "<red><bold>Error:</bold> Invalid command"
  current-players: "Current players:"
  no-current-players: "There are currently no players"
  added-player: "Added <player> to the player list"
  removed-player: "Removed <player> from the player list"
  player-already-added: "That player was already added to the player list"
  player-already-removed: "That player is not in the player list"
  added-all-players: "Added all online players to the player list"
  removed-all-players: "Removed all players from the player list"
  empty-player-list: "<red><bold>Error:</bold> The player list is empty. Add players with <gray>/randomizer players add</gray>"
  not-using-player-list: "<i><bold>Note:</bold> <gray>The player list is disabled. It can be enabled in the config</gray></i>"